config:
  runmode: slurm
  submit_jobs: false
  remote_workers: []
  runmode_settings:
    slurm:
      flags:
        - "--time=02:00:00"
        - "--mem-bind=local"
        - "--threads-per-core=1"
        - "--cpu-bind=cores"
        - "--nodes=4"
        - "--ntasks-per-node=32"
        - "--cpus-per-task=4"
        - "--mem=480GB"
      julia_settings: []
    local:
      n: 64
      julia_settings: []
  env_variables:
    GKSwstype: "100"
    JULIA_DEBUG: "Main,LegendSpecFits"
    JULIA_WORKER_TIMEOUT: "240"

processing:
  periods: [16, 18, 19]
  runs: all
  analysis_runs_only: false
  only_partitions: false
  only_runs: false

processors:
  process_peak_split:
    enabled: true
    n_workers: all
    category: cal
    rank: 1
    kwargs:
      reprocess: false
      timeout: 0
    dependencies: []

  process_decay_time:
    enabled: true
    n_workers: all
    category: cal
    rank: 2
    kwargs:
      reprocess: false
      timeout: 0
    dependencies: []

  process_filter_optimization:
    enabled: true
    n_workers: all
    category: cal
    rank: 3
    kwargs:
      reprocess: false
      timeout: 0
    dependencies: []

  process_aoe_optimization:
    enabled: true
    n_workers: all
    category: cal
    rank: 4
    kwargs:
      reprocess: false
      timeout: 0
    dependencies: []

  process_dsp_cal:
    enabled: true
    n_workers: all
    category: cal
    rank: 5
    kwargs:
      reprocess: false
      max_wvfs: 1000
      timeout: 0
      use_partition_filter: true
    dependencies:
      - p_process_aoe_optimization
      - p_process_filter_optimization
      - p_process_decay_time

  process_hit_cal:
    enabled: true
    n_workers: all
    category: cal
    rank: 6
    kwargs:
      reprocess: false
      timeout: 0
    dependencies: []

  process_ct_correction:
    enabled: true
    n_workers: all
    category: cal
    rank: 7
    kwargs:
      reprocess: false
      timeout: 0
    dependencies: []

  process_energy_calibration:
    enabled: true
    n_workers: all
    category: cal
    rank: 8
    kwargs:
      reprocess: false
      timeout: 0
    dependencies: []

  process_aoe_calibration_cut:
    enabled: true
    n_workers: all
    category: cal
    rank: 9
    kwargs:
      reprocess: false
      timeout: 0
    dependencies: []

  process_lq_calibration_cut:
    enabled: true
    n_workers: all
    category: cal
    rank: 10
    kwargs:
      reprocess: false
      timeout: 0
    dependencies: []

  process_psd_efficiencies:
    enabled: true
    n_workers: all
    category: cal
    rank: 11
    kwargs:
      reprocess: false
      timeout: 0
      use_partition_pars: true
    dependencies:
      - p_process_aoe_calibration_cut
      - p_process_lq_calibration_cut

  process_sipm_optimization_phy:
    enabled: true
    n_workers: all
    category: phy
    rank: 12
    kwargs:
      reprocess: false
      timeout: 0
      only_pulser: true
    dependencies: []

  process_dsp_phy:
    enabled: true
    n_workers: all
    category: phy
    rank: 13
    kwargs:
      reprocess: false
      timeout: 0
      max_wvfs: 1000
      use_partition_filter: true
    dependencies:
      - p_process_sipm_optimization_phy

  process_sipm_calibration_phy:
    enabled: true
    n_workers: all
    category: phy
    rank: 14
    kwargs:
      reprocess: false
      timeout: 0
    dependencies: []

  process_evt_phy:
    enabled: true
    n_workers: all
    category: phy
    rank: 15
    kwargs:
      reprocess: false
      timeout: 0
    dependencies:
      - p_process_sipm_calibration_phy

p_processors:
  p_process_decay_time:
    enabled: true
    n_workers: all
    rank: 1
    kwargs:
      reprocess: false
      timeout: 0
    dependencies:
      - process_peak_split

  p_process_filter_optimization:
    enabled: true
    n_workers: all
    rank: 2
    kwargs:
      reprocess: false
      timeout: 3000
    dependencies:
      - process_peak_split

  p_process_aoe_optimization:
    enabled: true
    n_workers: all
    rank: 3
    kwargs:
      reprocess: false
      timeout: 0
      max_wvfs: 35000
    dependencies:
      - process_peak_split

  p_process_energy:
    enabled: true
    n_workers: all
    rank: 4
    kwargs:
      reprocess: false
      timeout: 0
    dependencies:
      - process_energy_calibration

  p_process_aoe_calibration_cut:
    enabled: true
    n_workers: all
    rank: 5
    kwargs:
      reprocess: false
      timeout: 0
    dependencies: []

  p_process_aoe_cut:
    enabled: true
    n_workers: all
    rank: 6
    kwargs:
      reprocess: false
      timeout: 0
    dependencies:
      - process_aoe_calibration_cut

  p_process_lq_calibration_cut:
    enabled: true
    n_workers: all
    rank: 7
    kwargs:
      reprocess: false
      timeout: 0
    dependencies: []

  p_process_psd_efficiencies:
    enabled: true
    n_workers: all
    rank: 8
    kwargs:
      reprocess: false
      timeout: 0
    dependencies: []

  p_process_sipm_optimization_phy:
    enabled: true
    n_workers: all
    category: phy
    rank: 9
    kwargs:
      reprocess: false
      timeout: 0
    dependencies:
      - process_sipm_optimization_phy

  p_process_sipm_calibration_phy:
    enabled: true
    n_workers: all
    category: phy
    rank: 10
    kwargs:
      reprocess: false
      timeout: 0
    dependencies:
      - process_dsp_phy
      - process_sipm_optimization_phy

  p_process_skm_phy:
    enabled: true
    n_workers: all
    category: phy
    rank: 11
    kwargs:
      reprocess: false
      timeout: 0
    dependencies:
      - process_evt_phy
