[DEFAULT]

# PATH variable to deal with LATEX problem in matplotlib
path = /NO

# absolute path of the main project folder
project_folder = /home/ga26tel/legend/l60_r027/cal/dsp/

[FOLDER]

# specify data input folder of raw data
folder_raw = /mnt/atlas01/users/henkes/l60_r027/cal/raw/

# specify data input and output folder of tier1 data
